name: CI

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CostVision.slnx

      - name: Build
        run: dotnet build CostVision.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test CostVision.slnx --no-build --configuration Release
